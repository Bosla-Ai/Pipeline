name: Deploy pipeline (almiraj, self-hosted)

# Deploys the stateless tools pipeline to the almiraj production server.
# Runs ON the self-hosted runner that lives on the same box, so deployment
# is a local copy + venv sync + user systemd restart - no SSH secrets needed.
#
# Server prerequisites (one-time, already set up):
#   - ~/BoslaPipeline/venv        (python3.11 venv)
#   - ~/BoslaPipeline/.env        (env + secrets; NOT overwritten by deploy)
#   - user systemd unit bosla-pipeline + `loginctl enable-linger moha`

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/deploy-pipeline.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pipeline
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync code to service directory
        run: |
          rsync -a --delete \
            --exclude 'venv' --exclude '.git' --exclude '__pycache__' --exclude '*.pyc' \
            --exclude '.pytest_cache' --exclude '.env' --exclude 'cache' \
            ./ ~/BoslaPipeline/

      - name: Install deps + restart service
        run: |
          set -e
          cd ~/BoslaPipeline
          ./venv/bin/python -m pip install -q -r requirements.txt
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user restart bosla-pipeline
          # Startup takes ~7s (Redis connect timeout included); poll instead of
          # a fixed sleep so a slow boot doesn't fail an otherwise-good deploy.
          for i in $(seq 1 15); do
            sleep 3
            if curl -fsS -m 5 http://127.0.0.1:7860/health; then
              echo
              echo "deployed: $(systemctl --user is-active bosla-pipeline) (after $((i*3))s)"
              exit 0
            fi
          done
          echo "pipeline did not become healthy within 45s" >&2
          systemctl --user status bosla-pipeline --no-pager || true
          exit 1

      - name: Smoke tools endpoint
        run: |
          curl -fsS -m 90 -X POST http://127.0.0.1:7860/tools/search_resources \
            -H 'Content-Type: application/json' \
            -d '{"source":"youtube","query":"docker basics","language":"en","limit":1}' \
            | head -c 200
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:7860/generate-roadmap)
          test "$code" = "404" && echo "legacy route 404 OK"
