name: Build pipeline image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      IMAGE: bosla26/bosla-pipeline:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ARM64 image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.almiraj
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=pipeline-arm64
          cache-to: type=gha,scope=pipeline-arm64,mode=max
      - name: Verify image and authenticated HTTP tools
        env:
          PIPELINE_SHARED_SECRET: ci-only-pipeline-secret
          PIPELINE_BASE_URL: http://127.0.0.1:7860
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run -d --name pipeline-smoke -p 127.0.0.1:7860:7860 \
            -e PIPELINE_SHARED_SECRET "$IMAGE"
          # Exercise real imports and ranking without external YouTube traffic.
          docker exec -i pipeline-smoke python - <<'PY'
          from src.tools.file_cache import write_json_list
          write_json_list("search-resources", "en:Python tutorial for beginners", [{
              "id": "bosla_test1", "title": "Python fundamentals CI fixture",
              "duration": 600, "view_count": 10000, "channel": "CI fixture",
          }])
          PY
          python3 scripts/check_pipeline.py
      - name: Container logs on failure
        if: failure()
        run: docker logs --tail 100 pipeline-smoke 2>&1 || true
      - name: Remove test container
        if: always()
        run: docker rm -f pipeline-smoke 2>/dev/null || true
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          docker tag "$IMAGE" bosla26/bosla-pipeline:latest
          docker push bosla26/bosla-pipeline:latest
