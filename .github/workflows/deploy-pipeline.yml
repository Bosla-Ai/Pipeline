name: Deploy pipeline to Almiraj

on:
  workflow_run:
    workflows: [Build pipeline image]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, almiraj, bosla]
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Deploy the verified commit
        run: |
          set -euo pipefail
          sudo -n /run/current-system/sw/bin/bosla-deploy pipeline "$DEPLOY_SHA"
      - name: Verify production HTTPS and authenticated search
        env:
          PIPELINE_BASE_URL: https://pipeline.almiraj.xyz
          PIPELINE_SHARED_SECRET: ${{ secrets.PIPELINE_SHARED_SECRET }}
          EXPECTED_REVISION: ${{ env.DEPLOY_SHA }}
        run: python3 scripts/check_pipeline.py
